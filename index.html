<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#11111a">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>junioraww — latest projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="scene-container"></div>
    
    <div class="center">
      <div class="portfolio-container card-closed" id="portfolio-container">
        <div id="projects-column">
          <div class="title">latest projects</div>
          <div id="list"></div>
          <div class="nav-controls">
            <a class="hoverable" id="next">next</a>
            <div id="pagination-dots" class="pagination-dots"></div>
          </div>
        </div>

        <div id="preview-card" class="preview-card hidden">
          <div class="card-caret" id="card-caret"></div>

          <div class="card-header">
            <div class="card-title" id="card-title">maxplus</div>
            <div class="card-meta">
              <span id="card-commit">commit: 10.11.2026</span>
              <button id="card-close" class="card-close" title="Закрыть превью" aria-label="Закрыть">✕</button>
            </div>
          </div>

          <div class="code-box">
            <div class="code-header">
              <span class="code-path" id="code-path">crates/crypto/src/cipher.rs</span>
              <button id="code-reroll" class="code-reroll" title="Случайный сниппет кода (R)" aria-label="Перегенерировать код">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
                </svg>
              </button>
            </div>
            <div class="code-viewport">
              <pre class="code-content" id="code-content"></pre>
            </div>
          </div>

          <div class="card-actions" id="card-actions"></div>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <script src="fill.js"></script>
    <script src="script.js"></script>
</body>
</html>
